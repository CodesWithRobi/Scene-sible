<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scene-sible</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="app">

    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 471 471" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M235.5 471C235.5 438.423 229.22 407.807 216.66 379.155C204.492 350.503 187.811 325.579 166.616 304.384C145.421 283.189 120.498 266.508 91.845 254.34C63.1925 241.78 32.5775 235.5 0 235.5C32.5775 235.5 63.1925 229.416 91.845 217.249C120.498 204.689 145.421 187.811 166.616 166.616C187.811 145.421 204.492 120.497 216.66 91.845C229.22 63.1925 235.5 32.5775 235.5 0C235.5 32.5775 241.584 63.1925 253.751 91.845C266.311 120.497 283.189 145.421 304.384 166.616C325.579 187.811 350.503 204.689 379.155 217.249C407.807 229.416 438.423 235.5 471 235.5C438.423 235.5 407.807 241.78 379.155 254.34C350.503 266.508 325.579 283.189 304.384 304.384C283.189 325.579 266.311 350.503 253.751 379.155C241.584 407.807 235.5 438.423 235.5 471Z"></path>
        </svg>
      </div>
      <div>
        <h1>Scene-sible</h1>
        <p>Catholic movie guidance</p>
      </div>
    </header>

    <section class="card">
      <label class="field-label">AI provider</label>
      <div class="provider-pills" id="providerPills"></div>
    </section>

    <section class="card">
      <div class="field-row">
        <label class="field-label" for="modelSelect">Model</label>
        <button class="link-btn" id="refreshBtn" type="button">Refresh</button>
      </div>
      <select id="modelSelect"></select>
      <p class="hint" id="modelMeta"></p>
    </section>

    <section class="card" id="keySection" hidden>
      <label class="field-label" for="apiKey">API key</label>
      <div class="key-row">
        <input type="password" id="apiKey" placeholder="Paste your API key" autocomplete="off" spellcheck="false" />
        <button class="link-btn" id="toggleKey" type="button">Show</button>
      </div>
      <p class="hint">Stored locally in your browser only.</p>
    </section>

    <section class="card" id="freeNote" hidden>
      <p class="free-note">No API key needed — uses OVHcloud AI Endpoints' anonymous free tier (~2 requests/min per IP). Add a keyed provider below for reliable, faster results.</p>
    </section>

    <button class="save-btn" id="saveBtn" type="button">Save settings</button>
    <p class="status" id="status"></p>

    <footer class="app-footer">
      <a href="https://github.com/CodesWithRobi" target="_blank">GitHub</a>
      <span class="dot">·</span>
      <a href="https://www.linkedin.com/in/CodesWithRobi" target="_blank">LinkedIn</a>
    </footer>

  </div>
  <script src="popup.js"></script>
</body>

</html>
